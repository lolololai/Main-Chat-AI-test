stages:
  - test
  - build
  - deploy

test-be:
  stage: test
  image: node:24-alpine
  script:
    - cd BE
    - npm ci
    - npm run check

test-fe:
  stage: test
  image: node:24-alpine
  script:
    - cd FE
    - npm ci
    - npm run build

.build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build --platform linux/amd64 --build-arg VITE_BE_URL="https://chat-ai-be-latest.onrender.com" -t "$DOCKERHUB_USERNAME/$IMAGE:latest" -t "$DOCKERHUB_USERNAME/$IMAGE:$CI_COMMIT_SHORT_SHA" "./$DIR"
    - docker push "$DOCKERHUB_USERNAME/$IMAGE" --all-tags

build-be:
  extends: .build-image
  variables:
    IMAGE: chat-ai-be
    DIR: BE

build-fe:
  extends: .build-image
  variables:
    IMAGE: chat-ai-fe
    DIR: FE

.deploy:
  stage: deploy
  image:
    name: curlimages/curl:8.10.1
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-be:
  extends: .deploy
  script:
    - curl -fsS -X POST "$RENDER_DEPLOY_HOOK_BE"

deploy-fe:
  extends: .deploy
  script:
    - curl -fsS -X POST "$RENDER_DEPLOY_HOOK_FE"