server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets เสิร์ฟจาก FE/public/ ที่ mount เข้ามาที่ /usr/share/nginx/public
    # → เพิ่ม/เปลี่ยนรูปใน public/ ปุ๊บ เว็บเห็นป๊บ ไม่ต้อง rebuild image
    # ถ้าไม่มีไฟล์ใน public ให้ fallback ไปหาใน dist (build ดีอัตโนมัติ)
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|avif|bmp|glb|gltf|mp4|webm|pdf|txt|json|woff2?|ttf|otf)$ {
        root /usr/share/nginx/public;
        try_files $uri @dist_asset;
        add_header Cache-Control "no-cache";
    }

    location @dist_asset {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Proxy API calls ไปยัง BE:
    # - บน docker-compose: "be" คือ hostname ของ service BE (Docker DNS resolve ได้ปกติ)
    # - บน Vercel: ไม่มี DNS ของ services — คำขอ /messages และ /status ถูก rewrite ไปยัง service `be` โดยอัตโนมัติแล้ว (vercel.json)
    #   ใช้ variable upstream (set $upstream_be) เพื่อให้ nginx ไม่ resolve "be" ตอน start — ถ้ก resolve ไม่ได้ nginx จะ exit เลยแต่เริ่มไม่สำเร็จ
    location /messages {
        resolver 127.0.0.11 1.1.1.1;
        set $upstream_be "be";
        proxy_pass http://$upstream_be:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /status {
        resolver 127.0.0.11 1.1.1.1;
        set $upstream_be "be";
        proxy_pass http://$upstream_be:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
