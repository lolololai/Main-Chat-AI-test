server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets เสิร์ฟจาก FE/public/ ที่ mount เข้ามาที่ /usr/share/nginx/public
    # → เพิ่ม/เปลี่ยนรูปใน public/ ปุ๊บ เว็บเห็นปั๊บ ไม่ต้อง rebuild image
    # ถ้าไม่มีไฟล์ใน public ให้ fallback ไปหาใน dist (build เดิม)
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|avif|bmp|glb|gltf|mp4|webm|pdf|txt|json|woff2?|ttf|otf)$ {
        root /usr/share/nginx/public;
        try_files $uri @dist_asset;
        add_header Cache-Control "no-cache";
    }

    location @dist_asset {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Proxy API calls ไปที่ BE container (ชื่อ service "be" ใน docker-compose)
    location /messages {
        proxy_pass         http://be:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /status {
        proxy_pass         http://be:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
